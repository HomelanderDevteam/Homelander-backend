# Render "Blueprint": New + > Blueprint > pick this repo. Check current plan limits on render.com first.
services:
  - type: web
    name: homelander-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: homelander-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"          # tighten to CORS_ALLOWED_ORIGINS before real launch
      - key: ADMIN_PHONE_NUMBER
        sync: false            # you will be asked for this in the dashboard
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: homelander-db
    plan: free
